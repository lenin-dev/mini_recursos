<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 5rem;
      margin: 0;
      color: #ff6b6b;
    }
    p {
      font-size: 1.5rem;
      margin: 20px 0;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      text-decoration: none;
      color: white;
      background: #007bff;
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    a:hover {
      background: #0056b3;
    }
    .illustration {
      margin-top: 20px;
    }
    .illustration img {
      width: 300px;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Oops! La página no existe.</p>
    <a href="/">Go Back to Home</a>
    <div class="illustration">
      <img src="https://via.placeholder.com/300x200" alt="404 Illustration">
    </div>
  </div>
</body>
</html>
