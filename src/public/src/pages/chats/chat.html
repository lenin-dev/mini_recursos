<!DOCTYPE html>
<html lang="en-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats</title>
    <link rel="stylesheet" href="./styles/chats.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h3>Chats</h3>
                <span>⚙️</span>
            </div>
            <div class="contacts">
            </div>
        </div>
        <div class="chat-area">
            <div class="header">
                <img src="https://via.placeholder.com/50" height="50" width="50" alt="User">
                <span>John Doe</span>
                <button class="btn" id="cerrar-chat">Cerrar</button>
            </div>
            <div class="messages">
                <div class="message">Hello!</div>
                <div class="message sent">Hi there!</div>
                <div class="message">How are you?</div>
                <div class="message sent">I'm good, thanks. You?</div>
            </div>
            <form id="mensaje_enviar" class="message-box">
                <input class="text-mensaje" type="text" placeholder="Escribe un mensaje...">
                <button class="btn enviarcolor">➤</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./controller/chat.controller.js"></script>
    <script src="./controller/mensajeria.controller.js"></script>
</body>
</html>
